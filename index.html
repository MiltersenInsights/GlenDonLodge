<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glen Don Lodge</title>

  <!-- 
  ╔══════════════════════════════════════════════════════════════════════╗
  ║                  GLEN DON LODGE — SETUP GUIDE                        ║
  ╚══════════════════════════════════════════════════════════════════════╝
 
  This file is ready to deploy on GitHub Pages once you fill in the CONFIG
  block near the bottom of this file. It uses two free services:

  ┌──────────────────────────────────────────────────────────────────────┐
  │  1. FIREBASE  — stores all bookings, shared across all devices        │
  └──────────────────────────────────────────────────────────────────────┘

    a) Go to https://console.firebase.google.com
    b) Click "Add project" → name it "glen-don-lodge" → Create project
    c) In the left menu: Build → Firestore Database
    d) "Create database" → "Start in test mode" → Next → Enable
    e) Gear icon ⚙ → Project settings → scroll to "Your apps"
    f) Click the web icon </> → register with any nickname → Continue
    g) Copy the firebaseConfig values into the CONFIG block below

  ┌──────────────────────────────────────────────────────────────────────┐
  │  2. EMAILJS  — sends emails straight from the browser, no backend     │
  └──────────────────────────────────────────────────────────────────────┘

    Free tier = 200 emails/month (plenty for a family cabin)

    a) Go to https://www.emailjs.com → create a free account
    b) Email Services → Add New Service → Gmail (or your provider)
       → follow the prompts → copy the SERVICE ID shown
    c) Email Templates → Create New Template × 4:

       ── template_confirm  (sent to family when they submit a request) ─
       To Email:  {{to_email}}
       Subject:   Glen Don Lodge — booking request received!
       Body:
         Hi {{to_name}},

         Thanks for your booking request at Glen Don Lodge! 🏡

         📅 Check-in:  {{check_in}}
         📅 Check-out: {{check_out}}
         🌙 Nights:    {{nights}}
         👥 Guests:    {{guests}}

         The cabin admin will review it and be in touch soon.

       ── template_approved  (sent when admin approves) ────────────────
       To Email:  {{to_email}}
       Subject:   ✅ Glen Don Lodge — your stay is confirmed!
       Body:
         Hi {{to_name}},

         Your stay at Glen Don Lodge is CONFIRMED! 🎉

         📅 Check-in:  {{check_in}}
         📅 Check-out: {{check_out}}
         🌙 Nights:    {{nights}}
         👥 Guests:    {{guests}}

         See you there! 🏡

       ── template_declined  (sent when admin declines) ────────────────
       To Email:  {{to_email}}
       Subject:   Glen Don Lodge — about your booking request
       Body:
         Hi {{to_name}},

         Unfortunately the dates {{check_in}} → {{check_out}}
         aren't available. Please check the calendar for open slots
         and send a new request whenever you like.

         The Glen Don Lodge admin 🏡

       ── template_broadcast  (admin announcements to everyone) ────────
       To Email:  {{to_email}}
       Subject:   {{broadcast_subject}}
       Body:
         Hi {{to_name}},

         {{broadcast_message}}

         — The Glen Don Lodge admin 🏡

         ─────────────────────────────────────────────
         You're on the Glen Don Lodge family list.
         Reply to this email to be removed.

    d) Account → API Keys → copy your Public Key

  ┌──────────────────────────────────────────────────────────────────────┐
  │  3. GITHUB PAGES  — hosting                                           │
  └──────────────────────────────────────────────────────────────────────┘

    a) Create a GitHub repo (e.g. "glen-don-lodge")
    b) Push this file as  index.html  to the main branch
    c) Repo Settings → Pages → Source: Deploy from branch
       → Branch: main → Folder: / (root) → Save
    d) Your site will be live at:
       https://YOUR-USERNAME.github.io/glen-don-lodge

    Tip: To update the site later, just edit index.html and push again.

  ══════════════════════════════════════════════════════════════════════
  -->

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest:    #2D5016;
      --forest-dk: #1e3a0f;
      --bark:      #8B4513;
      --cream:     #faf7f2;
      --warm-bg:   #f5f0e8;
      --card-bg:   #ffffff;
      --border:    #e0d8cc;
      --text:      #1a1612;
      --muted:     #6b6358;
      --faint:     #9e9488;
      --pending-bg:#faecc8;
      --pending-tx:#7a4f00;
      --pending-bd:#e8c570;
      --booked-bg: #f0c4c4;
      --booked-tx: #8b1a1a;
      --booked-bd: #e09090;
      --ok-bg:     #d4edda;
      --ok-tx:     #1a5c2e;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--warm-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────── */
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    /* ── Header ───────────────────────────────────────── */
    .site-header {
      text-align: center;
      padding: 2.25rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    .site-logo {
      font-family: 'Lora', serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .site-sub {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .site-nav {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    .site-nav button {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .site-nav button:hover { background: var(--cream); color: var(--text); }
    .site-nav button.active { background: var(--forest); color: #fff; border-color: var(--forest); }

    /* ── Cards ────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-pad { padding: 1.25rem 1.5rem; }

    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 9px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--cream); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
    }
    .btn-primary:hover { background: var(--forest-dk); }

    .btn-danger {
      background: #8b1a1a;
      color: #fff;
      border-color: #8b1a1a;
    }
    .btn-danger:hover { background: #6b1212; }

    .btn-full { width: 100%; font-size: 16px; padding: 13px 24px; }

    /* ── Forms ────────────────────────────────────────── */
    .form-group { margin-bottom: 1.25rem; }

    label.lbl {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input.inp, textarea.inp, select.inp {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--cream);
      color: var(--text);
      appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input.inp:focus, textarea.inp:focus, select.inp:focus {
      outline: none;
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(45,80,22,0.12);
    }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .hint { font-size: 12px; color: var(--faint); margin-top: 5px; }
    .err  { font-size: 13px; color: var(--booked-tx); margin-top: 6px; }
    .nights-note { font-size: 13px; color: var(--forest); font-weight: 500; margin-top: 6px; }

    /* ── Calendar ─────────────────────────────────────── */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .cal-nav button {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 36px; height: 36px;
      cursor: pointer;
      font-size: 18px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
    }

    .cal-nav button:hover { background: var(--cream); }

    .cal-month {
      font-family: 'Lora', serif;
      font-size: 18px;
      font-weight: 600;
    }

    table.cal {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }

    table.cal th {
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--faint);
      padding: 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    table.cal td { text-align: center; padding: 2px; }

    .day {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .day.available { color: var(--text); }
    .day.past      { color: var(--border); }
    .day.today     { border-color: var(--forest); color: var(--forest); font-weight: 600; }
    .day.booked    { background: var(--booked-bg); color: var(--booked-tx); border-color: var(--booked-bd); font-weight: 500; }
    .day.pending   { background: var(--pending-bg); color: var(--pending-tx); border-color: var(--pending-bd); font-weight: 500; }

    .legend {
      display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.75rem;
    }

    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted);
    }

    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 4px; border: 1px solid;
    }

    /* ── Badges ───────────────────────────────────────── */
    .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .badge.pending  { background: var(--pending-bg); color: var(--pending-tx); }
    .badge.approved { background: var(--ok-bg);      color: var(--ok-tx);      }
    .badge.rejected { background: var(--booked-bg);  color: var(--booked-tx);  }

    /* ── Booking cards ────────────────────────────────── */
    .booking-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      background: var(--card-bg);
    }

    .booking-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.4rem;
    }

    .booking-name {
      font-family: 'Lora', serif;
      font-size: 16px; font-weight: 600;
    }

    .booking-dates { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    .booking-meta  { font-size: 13px; color: var(--faint); margin-bottom: 0.75rem; }

    .booking-msg {
      font-size: 13px; font-style: italic;
      color: var(--muted);
      background: var(--cream);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }

    .booking-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* ── Tabs (admin) ─────────────────────────────────── */
    .tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 10px 18px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab.active { color: var(--forest); border-bottom-color: var(--forest); font-weight: 500; }
    .tab:hover  { color: var(--text); }

    /* ── Filter pills ─────────────────────────────────── */
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }

    .filter {
      font-size: 12px; padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .filter.active { background: var(--forest); color: #fff; border-color: var(--forest); }

    /* ── Stats row ────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1.5rem; }

    .stat {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.875rem;
      text-align: center;
    }

    .stat-num { font-size: 26px; font-weight: 600; color: var(--text); }
    .stat-lbl { font-size: 11px; color: var(--faint); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Gate screen ──────────────────────────────────── */
    .gate {
      min-height: 60vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1rem;
    }

    .gate-icon { font-size: 56px; margin-bottom: 1.25rem; }

    .gate h2 {
      font-family: 'Lora', serif;
      font-size: 24px; margin-bottom: 0.5rem;
    }

    .gate p { font-size: 15px; color: var(--muted); margin-bottom: 1.75rem; max-width: 280px; }

    .gate-form { width: 100%; max-width: 300px; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      60%      { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }

    /* ── Success screen ───────────────────────────────── */
    .success { text-align: center; padding: 2.5rem 1rem; }
    .success-icon { font-size: 52px; display: block; margin-bottom: 1rem; }
    .success h2 { font-family: 'Lora', serif; font-size: 22px; margin-bottom: 0.5rem; }
    .success p  { font-size: 15px; color: var(--muted); margin-bottom: 1.5rem; }

    /* ── Subscribe strip ──────────────────────────────── */
    .subscribe-strip {
      margin-top: 1.5rem;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }

    .subscribe-strip h3 {
      font-family: 'Lora', serif;
      font-size: 15px; font-weight: 600;
      margin-bottom: 4px;
    }

    .subscribe-strip p { font-size: 13px; color: var(--muted); margin-bottom: 0.875rem; }

    .subscribe-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .subscribe-row .inp { flex: 1; min-width: 140px; font-size: 14px; padding: 9px 12px; }

    /* ── Subscriber list ──────────────────────────────── */
    .sub-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .sub-row:last-child { border-bottom: none; }
    .sub-name { font-weight: 500; }
    .sub-email { color: var(--muted); font-size: 13px; }
    .sub-src { font-size: 11px; color: var(--faint); background: var(--cream); padding: 2px 8px; border-radius: 10px; }

    /* ── Broadcast form ───────────────────────────────── */
    .broadcast-box {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-top: 1rem;
    }

    .broadcast-box h3 { font-family: 'Lora', serif; font-size: 16px; margin-bottom: 1rem; }

    .bcc-strip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 1rem;
      max-height: 80px;
      overflow-y: auto;
    }

    /* ── Loading ──────────────────────────────────────── */
    .loading {
      text-align: center; padding: 2rem; color: var(--faint); font-size: 14px;
    }

    .loading::after {
      content: '';
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--forest);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-left: 8px; vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty {
      text-align: center; padding: 2rem;
      color: var(--muted); font-size: 14px;
      border: 1px dashed var(--border); border-radius: var(--radius);
    }

    .section-title {
      font-family: 'Lora', serif; font-size: 20px; font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .admin-topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .inline-actions { display: flex; gap: 8px; align-items: center; }

    @media (max-width: 480px) {
      .two-col { grid-template-columns: 1fr; }
      .site-logo { font-size: 24px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- ── GATE ─────────────────────────────────────────── -->
  <div id="screen-gate">
    <div class="site-header">
      <div class="site-logo">Glen Don Lodge</div>
      <div class="site-sub">The family cabin</div>
    </div>
    <div class="gate">
      <div class="gate-icon">🏡</div>
      <h2>Welcome, family!</h2>
      <p>Enter the family password to access the cabin booking.</p>
      <div class="gate-form">
        <div class="form-group">
          <input class="inp" type="password" id="gate-input"
            placeholder="Family password"
            style="text-align:center;font-size:18px;letter-spacing:3px;"
            onkeydown="if(event.key==='Enter')tryGate()">
        </div>
        <div id="gate-err" class="err" style="display:none;text-align:center;margin-bottom:0.75rem">
          Wrong password — check the WhatsApp group.
        </div>
        <button class="btn btn-primary btn-full" onclick="tryGate()">Enter</button>
      </div>
    </div>
  </div>

  <!-- ── MAIN APP (hidden until password entered) ─────── -->
  <div id="screen-app" style="display:none">

    <div class="site-header">
      <div class="site-logo">Glen Don Lodge</div>
      <div class="site-sub">The family cabin — book your stay</div>
      <nav class="site-nav">
        <button id="nav-calendar" class="active" onclick="showView('calendar')">📅 Calendar</button>
        <button id="nav-request"              onclick="showView('request')">✉️ Request a Stay</button>
        <button id="nav-admin"                onclick="showView('admin')">🔑 Admin</button>
      </nav>
    </div>

    <!-- Calendar view -->
    <div id="view-calendar"></div>

    <!-- Request view -->
    <div id="view-request" style="display:none"></div>

    <!-- Admin view -->
    <div id="view-admin" style="display:none"></div>

  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  CONFIG — fill in your values here before deploying
// ════════════════════════════════════════════════════════
const CONFIG = {
  passwords: {
    family: 'glendon',   // Share this in the WhatsApp group
    admin:  'glendon0825',     // Keep this private — just for you
  },

  firebase: {
    apiKey:            "YOUR_API_KEY",
    authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
    projectId:         "YOUR_PROJECT_ID",
    storageBucket:     "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId:             "YOUR_APP_ID"
  },

  emailjs: {
    publicKey: 'YOUR_EMAILJS_PUBLIC_KEY',
    serviceId: 'YOUR_EMAILJS_SERVICE_ID',
    templates: {
      confirm:   'template_confirm',    // sent on request submission
      approved:  'template_approved',   // sent on approval
      declined:  'template_declined',   // sent on decline
      broadcast: 'template_broadcast',  // admin announcements
    }
  }
};
// ════════════════════════════════════════════════════════

// ── Firebase & EmailJS init ────────────────────────────
let db;
try {
  firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
} catch(e) {
  console.warn('Firebase not configured yet:', e.message);
}

const emailConfigured = () =>
  CONFIG.emailjs.publicKey && !CONFIG.emailjs.publicKey.startsWith('YOUR_');

if (emailConfigured()) {
  emailjs.init(CONFIG.emailjs.publicKey);
}

// ── State ──────────────────────────────────────────────
let bookings    = [];
let subscribers = [];
let calYear, calMonth;
let adminLoggedIn = false;
let adminTab      = 'requests';
let adminFilter   = 'all';
let reqSuccess    = false;
let currentView   = 'calendar';

const today = new Date();
calYear  = today.getFullYear();
calMonth = today.getMonth();

// ── Firebase listeners ─────────────────────────────────
function startListeners() {
  if (!db) return;

  db.collection('bookings')
    .orderBy('checkIn')
    .onSnapshot(snap => {
      bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (currentView === 'calendar') renderCalendar();
      if (currentView === 'admin' && adminLoggedIn) renderAdminContent();
    }, err => console.error('Bookings listener error:', err));

  db.collection('subscribers')
    .orderBy('subscribedAt')
    .onSnapshot(snap => {
      subscribers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (currentView === 'admin' && adminLoggedIn) renderAdminContent();
    }, err => console.error('Subscribers listener error:', err));
}

// ── Firestore helpers ──────────────────────────────────
async function addBooking(data) {
  if (!db) { bookings.push({ id: uid(), ...data }); return; }
  await db.collection('bookings').add(data);
}

async function updateBookingStatus(id, status) {
  if (!db) {
    const b = bookings.find(x => x.id === id);
    if (b) b.status = status;
    return;
  }
  await db.collection('bookings').doc(id).update({ status });
}

async function removeBooking(id) {
  if (!db) { bookings = bookings.filter(x => x.id !== id); return; }
  await db.collection('bookings').doc(id).delete();
}

async function addSubscriber(name, email) {
  const record = { name, email, source: 'subscribe', subscribedAt: new Date().toISOString() };
  if (!db) { subscribers.push({ id: uid(), ...record }); return; }
  // Prevent duplicates
  const existing = await db.collection('subscribers').where('email', '==', email).get();
  if (!existing.empty) return;
  await db.collection('subscribers').add(record);
}

async function removeSubscriber(id) {
  if (!db) { subscribers = subscribers.filter(x => x.id !== id); return; }
  await db.collection('subscribers').doc(id).delete();
}

// ── Email helpers ──────────────────────────────────────
async function sendEmail(templateId, params) {
  if (!emailConfigured()) { console.info('EmailJS not configured — skipping email'); return; }
  try {
    await emailjs.send(CONFIG.emailjs.serviceId, templateId, {
      to_email: params.email,
      to_name:  params.name,
      ...params
    });
  } catch(e) { console.error('EmailJS send failed:', e); }
}

function makeEmailParams(b) {
  return {
    email:    b.email,
    name:     b.name,
    check_in: fmtDate(b.checkIn),
    check_out:fmtDate(b.checkOut),
    nights:   nightCount(b.checkIn, b.checkOut),
    guests:   b.guests,
  };
}

// ── Utilities ──────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function fmtDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {
    day: 'numeric', month: 'short', year: 'numeric'
  });
}

function nightCount(a, b) {
  return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
}

function todayStr() { return today.toISOString().slice(0,10); }

function getBlockedDates() {
  const approved = {}, pending = {};
  bookings.forEach(b => {
    if (b.status === 'rejected') return;
    const d = new Date(b.checkIn+'T12:00:00');
    const end = new Date(b.checkOut+'T12:00:00');
    while (d < end) {
      const k = d.toISOString().slice(0,10);
      if (b.status === 'approved') approved[k] = b;
      else if (b.status === 'pending') pending[k] = b;
      d.setDate(d.getDate()+1);
    }
  });
  return { approved, pending };
}

// All unique emails for broadcast
function allEmails() {
  const map = {};
  bookings.forEach(b => { if (b.email) map[b.email.toLowerCase()] = { name: b.name, email: b.email, source: 'booking' }; });
  subscribers.forEach(s => { if (s.email) map[s.email.toLowerCase()] = { name: s.name, email: s.email, source: 'subscriber' }; });
  return Object.values(map);
}

// ── Gate ───────────────────────────────────────────────
function tryGate() {
  const pw = document.getElementById('gate-input').value;
  const errEl = document.getElementById('gate-err');
  if (pw.toLowerCase() === CONFIG.passwords.family.toLowerCase()) {
    document.getElementById('screen-gate').style.display = 'none';
    document.getElementById('screen-app').style.display = '';
    startListeners();
    showView('calendar');
  } else {
    errEl.style.display = 'block';
    const inp = document.getElementById('gate-input');
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
    inp.value = '';
    inp.focus();
  }
}

// ── View router ────────────────────────────────────────
function showView(v) {
  currentView = v;
  ['calendar','request','admin'].forEach(name => {
    document.getElementById('view-'+name).style.display = name === v ? '' : 'none';
    const btn = document.getElementById('nav-'+name);
    if (btn) btn.classList.toggle('active', name === v);
  });
  if (v === 'calendar') renderCalendar();
  else if (v === 'request') renderRequest();
  else if (v === 'admin') renderAdmin();
}

// ══════════════════════════════════════════════════════
//  CALENDAR VIEW
// ══════════════════════════════════════════════════════
function renderCalendar() {
  const el = document.getElementById('view-calendar');
  const { approved, pending } = getBlockedDates();
  const ts = todayStr();
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first = new Date(calYear, calMonth, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  let rows = '';
  for (let row = 0; row < 6; row++) {
    let cells = '';
    for (let col = 0; col < 7; col++) {
      const n = row*7 + col - startDay + 1;
      if (n < 1 || n > daysInMonth) { cells += '<td></td>'; continue; }
      const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
      let cls = 'day';
      if      (approved[ds]) cls += ' booked';
      else if (pending[ds])  cls += ' pending';
      else if (ds < ts)      cls += ' past';
      else if (ds === ts)    cls += ' today available';
      else                   cls += ' available';
      cells += `<td><span class="${cls}">${n}</span></td>`;
    }
    rows += `<tr>${cells}</tr>`;
    if (row*7 + 6 - startDay + 1 >= daysInMonth) break;
  }

  el.innerHTML = `
    <div class="card card-pad" style="margin-bottom:1rem">
      <div class="cal-nav">
        <button onclick="prevMonth()">&#8249;</button>
        <div class="cal-month">${monthNames[calMonth]} ${calYear}</div>
        <button onclick="nextMonth()">&#8250;</button>
      </div>
      <table class="cal">
        <thead><tr>
          <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--cream);border-color:var(--border)"></div>Available</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--pending-bg);border-color:var(--pending-bd)"></div>Pending</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--booked-bg);border-color:var(--booked-bd)"></div>Booked</div>
      </div>
    </div>
    <button class="btn btn-primary btn-full" onclick="showView('request')">Request a Stay</button>

    <div class="subscribe-strip" style="margin-top:1.25rem">
      <h3>📬 Stay in the loop</h3>
      <p>Leave your email to get cabin updates — season openings, news, and reminders.</p>
      <div class="subscribe-row">
        <input class="inp" type="text"  id="sub-name"  placeholder="Your name" style="flex:0.8">
        <input class="inp" type="email" id="sub-email" placeholder="your@email.com">
        <button class="btn btn-primary" onclick="handleSubscribe()" id="sub-btn">Subscribe</button>
      </div>
      <div id="sub-msg" style="display:none;font-size:13px;color:var(--ok-tx);margin-top:6px"></div>
    </div>`;
}

function prevMonth() { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

async function handleSubscribe() {
  const name  = document.getElementById('sub-name').value.trim();
  const email = document.getElementById('sub-email').value.trim();
  const msgEl = document.getElementById('sub-msg');
  const btn   = document.getElementById('sub-btn');

  if (!name || !email || !email.includes('@')) {
    msgEl.textContent = 'Please enter your name and a valid email.';
    msgEl.style.color = 'var(--booked-tx)';
    msgEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';
  await addSubscriber(name, email);
  msgEl.textContent = '✓ You\'re on the list!';
  msgEl.style.color = 'var(--ok-tx)';
  msgEl.style.display = 'block';
  document.getElementById('sub-name').value  = '';
  document.getElementById('sub-email').value = '';
  btn.disabled = false;
  btn.textContent = 'Subscribe';
}

      </div>`;
    return;
  }

  const ts = todayStr();
  el.innerHTML = `
    <div class="card card-pad">
      <div class="section-title">Request a Stay</div>
      <div class="two-col">
        <div class="form-group">
          <label class="lbl" for="f-name">Your name</label>
          <input class="inp" type="text" id="f-name" placeholder="e.g. Gran &amp; Grandad" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="lbl" for="f-email">Email address</label>
          <input class="inp" type="email" id="f-email" placeholder="your@email.com" autocomplete="email">
          <div class="hint">We'll send your confirmation here</div>
        </div>
      </div>
      <div class="form-group">
        <label class="lbl" for="f-phone">Phone <span style="font-weight:400;color:var(--faint)">(optional)</span></label>
        <input class="inp" type="tel" id="f-phone" placeholder="In case we need to reach you" autocomplete="tel">
      </div>
      <div class="two-col">
        <div class="form-group">
          <label class="lbl" for="f-in">Check-in date</label>
          <input class="inp" type="date" id="f-in" min="${ts}" onchange="updateNights()">
        </div>
        <div class="form-group">
          <label class="lbl" for="f-out">Check-out date</label>
          <input class="inp" type="date" id="f-out" min="${ts}" onchange="updateNights()">
        </div>
      </div>
      <div id="nights-note"></div>
      <div class="form-group" style="margin-top:1rem">
        <label class="lbl" for="f-guests">Number of guests</label>
        <input class="inp" type="number" id="f-guests" min="1" max="20" placeholder="1" style="max-width:120px">
      </div>
      <div class="form-group">
        <label class="lbl" for="f-note">Notes <span style="font-weight:400;color:var(--faint)">(optional)</span></label>
        <textarea class="inp" id="f-note" rows="3" placeholder="e.g. celebrating a birthday, bringing a dog…"></textarea>
      </div>
      <div id="req-err" class="err" style="display:none"></div>
      <button class="btn btn-primary btn-full" id="req-submit" onclick="submitRequest()">Send Booking Request</button>
      <p class="hint" style="text-align:center;margin-top:0.75rem">Your request goes to the cabin admin for approval. You'll get an email confirmation!</p>
    </div>`;
}

function updateNights() {
  const ci = document.getElementById('f-in').value;
  const co = document.getElementById('f-out').value;
  const el = document.getElementById('nights-note');
  if (ci && co && co > ci) {
    const n = nightCount(ci, co);
    el.innerHTML = `<div class="nights-note" style="margin-bottom:1rem">✓ ${n} night${n!==1?'s':''}</div>`;
  } else { el.innerHTML = ''; }
}

async function submitRequest() {
  const name   = document.getElementById('f-name').value.trim();
  const email  = document.getElementById('f-email').value.trim();
  const phone  = document.getElementById('f-phone').value.trim();
  const checkIn  = document.getElementById('f-in').value;
  const checkOut = document.getElementById('f-out').value;
  const guests = document.getElementById('f-guests').value;
  const note   = document.getElementById('f-note').value.trim();
  const errEl  = document.getElementById('req-err');
  const btn    = document.getElementById('req-submit');

  errEl.style.display = 'none';

  if (!name)                { showReqErr('Please enter your name.'); return; }
  if (!email || !email.includes('@')) { showReqErr('Please enter a valid email address.'); return; }
  if (!checkIn)             { showReqErr('Please choose a check-in date.'); return; }
  if (!checkOut)            { showReqErr('Please choose a check-out date.'); return; }
  if (checkOut <= checkIn)  { showReqErr('Check-out must be after check-in.'); return; }
  if (!guests || guests < 1){ showReqErr('Please enter the number of guests.'); return; }
  if (checkIn < todayStr()) { showReqErr('Check-in date cannot be in the past.'); return; }

  const { approved } = getBlockedDates();
  const d = new Date(checkIn+'T12:00:00');
  const end = new Date(checkOut+'T12:00:00');
  while (d < end) {
    if (approved[d.toISOString().slice(0,10)]) {
      showReqErr('Those dates overlap with an existing booking. Please check the calendar and choose different dates.');
      return;
    }
    d.setDate(d.getDate()+1);
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  const booking = {
    name, email, phone, checkIn, checkOut,
    guests: parseInt(guests),
    note,
    status: 'pending',
    requestedAt: new Date().toISOString()
  };

  await addBooking(booking);

  // Send confirmation email
  await sendEmail(CONFIG.emailjs.templates.confirm, makeEmailParams(booking));

  reqSuccess = true;
  renderRequest();
}

function showReqErr(msg) {
  const el = document.getElementById('req-err');
  el.textContent = msg;
  el.style.display = 'block';
  const btn = document.getElementById('req-submit');
  if (btn) { btn.disabled = false; btn.textContent = 'Send Booking Request'; }
}

  else if (adminTab === 'broadcast')   renderAdminBroadcast(el);

function setAdminTab(t) {
  adminTab = t;
  renderAdmin();
}

// ── Admin: Requests ────────────────────────────────────
function renderAdminRequests(el) {
  const counts = { pending:0, approved:0, rejected:0 };
  bookings.forEach(b => counts[b.status]++);

  const filtered = (adminFilter === 'all' ? [...bookings] : bookings.filter(b => b.status === adminFilter))
    .sort((a,b) => new Date(a.checkIn) - new Date(b.checkIn));

  const cards = filtered.length === 0
    ? `<div class="empty">No ${adminFilter === 'all' ? '' : adminFilter + ' '}bookings yet.</div>`
    : filtered.map(b => {
        const n = nightCount(b.checkIn, b.checkOut);
        return `
          <div class="booking-card">
            <div class="booking-top">
              <div class="booking-name">${b.name}</div>
              <span class="badge ${b.status}">${b.status}</span>
            </div>
            <div class="booking-dates">${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)} &nbsp;·&nbsp; ${n} night${n!==1?'s':''}</div>
            <div class="booking-meta">${b.guests} guest${b.guests!==1?'s':''} &nbsp;·&nbsp; ${b.email}${b.phone?' &nbsp;·&nbsp; '+b.phone:''}</div>
            ${b.note ? `<div class="booking-msg">"${b.note}"</div>` : ''}
            <div class="booking-actions">
              ${b.status !== 'approved' ? `<button class="btn btn-primary" onclick="adminApprove('${b.id}')">Approve</button>` : ''}
              ${b.status !== 'rejected' ? `<button class="btn btn-danger"  onclick="adminDecline('${b.id}')">Decline</button>` : ''}
              ${b.status !== 'pending'  ? `<button class="btn" onclick="adminReset('${b.id}')">Reset to pending</button>` : ''}
              <button class="btn" onclick="adminDelete('${b.id}')" style="margin-left:auto;color:var(--faint)">Delete</button>
            </div>
          </div>`;
      }).join('');

  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num">${counts.pending}</div><div class="stat-lbl">Pending</div></div>
      <div class="stat"><div class="stat-num">${counts.approved}</div><div class="stat-lbl">Approved</div></div>
      <div class="stat"><div class="stat-num">${counts.rejected}</div><div class="stat-lbl">Declined</div></div>
    </div>
    <div class="filters">
      <button class="filter ${adminFilter==='all'?'active':''}"      onclick="setFilter('all')">All</button>
      <button class="filter ${adminFilter==='pending'?'active':''}"  onclick="setFilter('pending')">Pending</button>
      <button class="filter ${adminFilter==='approved'?'active':''}" onclick="setFilter('approved')">Approved</button>
      <button class="filter ${adminFilter==='rejected'?'active':''}" onclick="setFilter('rejected')">Declined</button>
    </div>
    ${cards}`;
}

async function adminApprove(id) {
  await updateBookingStatus(id, 'approved');
  const b = bookings.find(x => x.id === id);
  if (b) await sendEmail(CONFIG.emailjs.templates.approved, makeEmailParams(b));
}

async function adminDecline(id) {
  await updateBookingStatus(id, 'rejected');
  const b = bookings.find(x => x.id === id);
  if (b) await sendEmail(CONFIG.emailjs.templates.declined, makeEmailParams(b));
}

async function adminReset(id)  { await updateBookingStatus(id, 'pending'); }
async function adminDelete(id) { if (confirm('Delete this booking?')) await removeBooking(id); }
function setFilter(f) { adminFilter = f; renderAdminContent(); }

// ── Admin: Broadcast ───────────────────────────────────
function renderAdminBroadcast(el) {
  const emails = allEmails();

  const bccList = emails.map(e => e.email).join(', ');

  el.innerHTML = `
    <p style="font-size:14px;color:var(--muted);margin-bottom:1rem">
      Send a message to everyone who has booked or subscribed — ${emails.length} people.
    </p>

    <div class="broadcast-box">
      <h3>✉️ Compose broadcast</h3>
      <div class="form-group">
        <label class="lbl" for="bc-subject">Subject</label>
        <input class="inp" type="text" id="bc-subject" placeholder="e.g. Glen Don Lodge is open for summer! 🌿">
      </div>
      <div class="form-group">
        <label class="lbl" for="bc-body">Message</label>
        <textarea class="inp" id="bc-body" rows="5" placeholder="Write your message here…"></textarea>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="sendBroadcast()">Send via EmailJS (${emails.length} emails)</button>
        <button class="btn" onclick="openBccMailto()">Open in my email app (BCC)</button>
      </div>
      <div id="bc-status" style="display:none;margin-top:0.75rem;font-size:14px;color:var(--ok-tx)"></div>
      <p class="hint" style="margin-top:0.75rem">
        <strong>EmailJS</strong> sends individually (uses quota — free tier allows 200/month).<br>
        <strong>Email app</strong> opens your mail client with all addresses in BCC — unlimited, free.
      </p>
    </div>

    ${emails.length > 0 ? `
    <div style="margin-top:1.25rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
        <span style="font-size:13px;font-weight:500">BCC address list (${emails.length})</span>
        <button class="btn" onclick="copyBcc()" style="font-size:12px;padding:5px 12px">Copy all</button>
      </div>
      <div class="bcc-strip" id="bcc-display">${bccList}</div>
    </div>` : '<div class="empty" style="margin-top:1rem">No emails collected yet.</div>'}`;
}

async function sendBroadcast() {
  const subject = document.getElementById('bc-subject').value.trim();
  const body    = document.getElementById('bc-body').value.trim();
  const statusEl = document.getElementById('bc-status');

  if (!subject || !body) { alert('Please fill in both the subject and message.'); return; }

  if (!emailConfigured()) {
    statusEl.textContent = '⚠ EmailJS is not configured yet — see the setup guide at the top of index.html';
    statusEl.style.color = 'var(--booked-tx)';
    statusEl.style.display = 'block';
    return;
  }

  const emails = allEmails();
  if (emails.length === 0) { alert('No emails to send to yet.'); return; }

  if (!confirm(`Send this broadcast to ${emails.length} people?`)) return;

  statusEl.textContent = `Sending… (0 / ${emails.length})`;
  statusEl.style.color = 'var(--ok-tx)';
  statusEl.style.display = 'block';

  let sent = 0;
  for (const e of emails) {
    await sendEmail(CONFIG.emailjs.templates.broadcast, {
      email: e.email,
      name:  e.name,
      broadcast_subject: subject,
      broadcast_message: body,
    });
    sent++;
    statusEl.textContent = `Sending… (${sent} / ${emails.length})`;
  }

  statusEl.textContent = `✓ Sent to ${sent} people!`;
  document.getElementById('bc-subject').value = '';
  document.getElementById('bc-body').value    = '';
}

function openBccMailto() {
  const emails  = allEmails();
  const subject = document.getElementById('bc-subject').value.trim();
  const body    = document.getElementById('bc-body').value.trim();
  const bcc     = emails.map(e => e.email).join(',');
  window.location.href = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function copyBcc() {
  const emails = allEmails().map(e => e.email).join(', ');
  navigator.clipboard.writeText(emails).then(() => {
    const btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy all', 2000);
  });
}

// ── Admin: Subscribers ─────────────────────────────────
function renderAdminSubscribers(el) {
  const emails = allEmails();

  if (emails.length === 0) {
    el.innerHTML = '<div class="empty">No emails collected yet. They\'ll appear here once people book or subscribe.</div>';
    return;
  }

  const rows = emails.map(e =>
    `<div class="sub-row">
      <div>
        <div class="sub-name">${e.name}</div>
        <div class="sub-email">${e.email}</div>
      </div>
      <span class="sub-src">${e.source === 'booking' ? '📅 booking' : '📬 subscriber'}</span>
    </div>`
  ).join('');

  // Find deletable subscriber-only entries
  const deletable = subscribers.filter(s => s.id);

  el.innerHTML = `
    <p style="font-size:14px;color:var(--muted);margin-bottom:1.25rem">
      ${emails.length} unique email address${emails.length!==1?'es':''} — combining bookings and subscribers.
    </p>
    <div class="card card-pad">${rows}</div>
    ${deletable.length > 0 ? `
    <div style="margin-top:1rem">
      <p style="font-size:12px;color:var(--faint);margin-bottom:0.5rem">To remove a subscriber, expand the list below.</p>
      ${subscribers.map(s => `
        <div class="sub-row" style="padding:0.5rem 0">
          <div><div class="sub-name" style="font-size:13px">${s.name} — ${s.email}</div></div>
          <button class="btn" onclick="removeSubscriber('${s.id}').then(renderAdminContent)" style="font-size:12px;padding:4px 10px">Remove</button>
        </div>`).join('')}
    </div>` : ''}`;
}

// ── Admin login ────────────────────────────────────────
function tryAdminLogin() {
  const pw = document.getElementById('a-pass').value;
  if (pw === CONFIG.passwords.admin) {
    adminLoggedIn = true;
    renderAdmin();
  } else {
    document.getElementById('a-err').style.display = 'block';
  }
}

// ── Keyboard shortcut: Enter on gate ──────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const gateInput = document.getElementById('gate-input');
    if (gateInput && document.activeElement === gateInput) tryGate();
  }
});
</script>
